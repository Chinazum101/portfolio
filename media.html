<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Page</title>
    <style type="text/css">
        body{
  background: linear-gradient(135deg, #021a2f, #0a2f4d 45%, #3a1b7d 100%);
        }
        a{
            background-color: rgb(55, 165, 255);
            text-decoration: none;
            font-size: 12pt;
            font-family: 'Inter Black', sans-serif;
            color: white;
            border: none;
            border-color: white;
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 20px;
            width: auto;
            text-align: center;
            margin-left: 50%;      
        
        }
        img{
            width: 300px;
            height: 300px;
            border-radius: 14px;
            display: flexbox;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            margin-top: 16px;
            transition: 0.25s ease;
        }
        img:hover{
            position: relative;
            transform: translateY(-4px);
        }
    </style>
</head>
<body>
    <br>
    <a href="index.html">Home</a>
    <br>
    <br>
    <section class="section">
<pre>     
    <img src="1.jpg"> <img src="2.jpg"> <img src="3.jpg"> <img src="4.jpg">
    <img src="5.jpg"> <img src="6.jpg"> <img src="7.jpg"> <img src="8.jfif">
    <img src="9.jfif"> <img src="10.png"> <img src="11.jpg"> <img src="12.jfif"></pre>

    </section>
</body>
</html>
